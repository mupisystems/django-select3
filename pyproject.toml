[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-select3"
version = "0.1.0"
description = "Framework-free Django form widgets: combobox and multiselect, with static and AJAX search."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Django>=4.2"]

license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Luccas Daniel", email = "luccas.daniel@mupisystems.com.br" },
]

keywords = ["django", "forms", "widgets", "select", "combobox", "multiselect", "autocomplete", "ajax"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mupisystems/django-select3"
Repository = "https://github.com/mupisystems/django-select3"
Issues = "https://github.com/mupisystems/django-select3/issues"
Changelog = "https://github.com/mupisystems/django-select3/releases"

[tool.setuptools]
include-package-data = true

# This repository stores the Django app directly in this folder.
# Map the Python package name `select3` to this directory.
package-dir = {"select3" = "."}

packages = ["select3"]

[tool.setuptools.package-data]
select3 = [
  "templates/**/*",
  "static/**/*",
]

[tool.setuptools.exclude-package-data]
select3 = [
  "assets/*",
  "tests/*",
  "LICENSE",
  "README.md",
  "pyproject.toml",
  "MANIFEST.in",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
