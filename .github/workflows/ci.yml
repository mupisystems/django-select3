name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            django: "Django>=4.2,<4.3"
          - python-version: "3.11"
            django: "Django>=4.2,<4.3"
          - python-version: "3.12"
            django: "Django>=5.0,<5.1"
          - python-version: "3.13"
            django: "Django>=5.2,<5.3"
    name: py${{ matrix.python-version }} / ${{ matrix.django }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.django }}" pytest
      - name: Run tests
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    name: build & metadata check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build & check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
